<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- Theme color matches the white app bars (app has no dark theme) -->
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  
  <!-- Apple Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- "default" = dark status bar text on a white bar (black-translucent renders white text, invisible on our white header) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Dukaan Book" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  
  <!-- Mobile & Formatting Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="Manage your store transactions, customers, and staff with Dukaan Book." />
  
  <title>Dukaan Book</title>
</head>

<body class="h-full antialiased bg-slate-50 text-slate-900 select-none">
  <div id="root" class="h-full flex flex-col"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
